name: Build Linux

# Solo su richiesta (gh workflow run), come il Mac: si costruisce quando si pubblica una versione.
# Runner ubuntu-22.04: l'AppImage chiede la glibc della macchina di build, così gira da Ubuntu 22.04 in su.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # solo sul runner: librerie per far girare Qt senza schermo, un portachiavi vero, GStreamer e Xvfb per le prove
      - name: Prepara il runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 gnome-keyring dbus-x11 \
            desktop-file-utils gstreamer1.0-tools gstreamer1.0-plugins-base xvfb libxtst6 libxrandr2 libxfixes3
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TK_PORTACHIAVI_OBBLIGATORIO: '1'
        run: |
          dbus-run-session -- bash -c 'printf "prova-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && bash linux/build_linux.sh'
      # l'AppImage va nella release del repo (lo spazio degli artifact di Actions è condiviso e si riempie);
      # la release si crea solo da main: le prove sui rami non devono comparire pubbliche
      - name: Carica l'AppImage nella release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(python3 -c "import re;print(re.search(r'VERSION = \"(.+)\"', open('tkdesk/__init__.py').read()).group(1))")"
          TAG="v$V"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "tk-desk $V" --notes "Build automatica" --target "$GITHUB_SHA" || true
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" dist/*.AppImage --clobber && break
            sleep 8
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
      # sui rami (prove): resoconti e immagini delle prove, per 3 giorni
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: prove-linux
          path: |
            dist/*.png
            dist/*.txt
            dist/*.log
            build/appimagetool.log
          retention-days: 3
          if-no-files-found: ignore
